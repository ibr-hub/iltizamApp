
workflows:
  iltizam_android:
    name: Iltizam Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Extract Flutter project
        script: |
          set -e
          unzip -o "$CM_BUILD_DIR/iltizam_flutter_with_penalties.zip" -d "$CM_BUILD_DIR"
          test -f "$CM_BUILD_DIR/iltizam_flutter_source/pubspec.yaml"

      - name: Configure Android SDK paths
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/iltizam_flutter_source/android/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$CM_BUILD_DIR/iltizam_flutter_source/android/local.properties"

      - name: Get Flutter dependencies
        script: |
          cd "$CM_BUILD_DIR/iltizam_flutter_source"
          flutter pub get

      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR/iltizam_flutter_source"
          flutter build apk --release

    artifacts:
      - iltizam_flutter_source/build/app/outputs/flutter-apk/app-release.apk
