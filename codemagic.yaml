workflows:
  iltizam-android-apk:
    name: Iltizam Android APK - signed test build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.47.2
      java: 17
      ndk: 27.0.12077973
    scripts:
      - name: Extract Flutter project from the uploaded archive
        script: |
          set -euo pipefail
          ZIP_PATH="$CM_BUILD_DIR/iltizam_flutter_with_penalties.zip"
          STAGING="$CM_BUILD_DIR/.iltizam_extract"
          test -f "$ZIP_PATH" || { echo "ERROR: archive not found: $ZIP_PATH"; exit 1; }
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          unzip -q -o "$ZIP_PATH" -d "$STAGING"
          PROJECT_DIR="$STAGING/iltizam_flutter_source"
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/android/app/build.gradle"
          grep -q 'signingConfig signingConfigs.debug' "$PROJECT_DIR/android/app/build.gradle" || { echo 'ERROR: test signing config missing'; exit 1; }
          cp -a "$PROJECT_DIR/." "$CM_BUILD_DIR/"
          test -f "$CM_BUILD_DIR/pubspec.yaml"
          echo 'Project extracted; debug signing is configured for the test APK.'
      - name: Preflight - verify project and toolchain
        script: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -x android/gradlew
          flutter --version
          java -version
          grep -n 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties
          grep -n 'compileSdk\|minSdk\|targetSdk\|jvmTarget\|signingConfig' android/app/build.gradle
      - name: Ensure Gradle wrapper launcher exists
        script: |
          set -euo pipefail
          WRAPPER_JAR=android/gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "$WRAPPER_JAR" ]; then
            SEED_DIR="$(mktemp -d)"
            flutter create --platforms=android --project-name wrapper_seed --org com.example "$SEED_DIR/wrapper_seed"
            test -f "$SEED_DIR/wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar"
            mkdir -p android/gradle/wrapper
            cp "$SEED_DIR/wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar" "$WRAPPER_JAR"
            rm -rf "$SEED_DIR"
          fi
          test -s "$WRAPPER_JAR"
          chmod +x android/gradlew
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze Dart source
        script: flutter analyze --no-pub
      - name: Run widget smoke test
        script: flutter test --no-pub
      - name: Build signed test APK
        script: flutter build apk --release --no-pub
      - name: Verify APK signature
        script: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK" || { echo 'ERROR: APK missing or empty'; exit 1; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo 'ERROR: Android SDK path not available'; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo 'ERROR: apksigner not found in Android SDK build-tools'; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          echo 'APK signature verification passed.'
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
