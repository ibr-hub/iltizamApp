workflows:
  iltizam-android-apk:
    name: Iltizam Android APK - pinned toolchain
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.47.2
      java: 17
      ndk: 27.0.12077973
    scripts:
      - name: Extract Flutter project from the uploaded archive
        script: |
          set -euo pipefail
          ZIP_PATH="$CM_BUILD_DIR/iltizam_flutter_with_penalties.zip"
          STAGING="$CM_BUILD_DIR/.iltizam_extract"
          test -f "$ZIP_PATH" || { echo "ERROR: archive not found: $ZIP_PATH"; exit 1; }
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          unzip -q -o "$ZIP_PATH" -d "$STAGING"
          PROJECT_DIR="$STAGING/iltizam_flutter_source"
          test -f "$PROJECT_DIR/pubspec.yaml" || { echo "ERROR: pubspec.yaml missing inside expected folder iltizam_flutter_source"; find "$STAGING" -maxdepth 3 -type f | head -80; exit 1; }
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/android/settings.gradle"
          cp -a "$PROJECT_DIR/." "$CM_BUILD_DIR/"
          test -f "$CM_BUILD_DIR/pubspec.yaml"
          test -f "$CM_BUILD_DIR/lib/main.dart"
          echo "Archive extracted and Flutter project placed at repository root."
      - name: Preflight - verify project structure and toolchain
        script: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -x android/gradlew
          echo '--- Flutter / Dart ---'
          flutter --version
          echo '--- Java ---'
          java -version
          echo '--- Android toolchain versions declared by project ---'
          grep -n 'com.android.application\|org.jetbrains.kotlin.android' android/settings.gradle
          grep -n 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties
          grep -n 'compileSdk\|buildToolsVersion\|ndkVersion\|minSdk\|targetSdk\|jvmTarget' android/app/build.gradle
          echo 'Preflight checks passed.'
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze Dart source
        script: flutter analyze --no-pub
      - name: Run widget smoke test
        script: flutter test --no-pub
      - name: Build release APK
        script: flutter build apk --release --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
